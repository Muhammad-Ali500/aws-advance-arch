# Standalone-repo version (like the real slotta-fe/amplify.yml, Next.js SSR).
# In THIS monorepo Amplify reads the root /amplify.yml instead - keep the
# two in sync.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || true
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
