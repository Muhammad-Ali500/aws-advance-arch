# Standalone-repo version (like the real slotta-admin-ui/amplify.yml).
# In THIS monorepo Amplify reads the root /amplify.yml instead - keep the
# two in sync.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Content-Security-Policy'
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self';
          img-src 'self' data: blob: https://*.amazonaws.com;
          font-src 'self';
          connect-src 'self' https://*.amazonaws.com;
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none';
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
