<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>dev-admin - Slotta dummy admin portal</title>
  <!-- styles in a file, not inline: amplify.yml sends a strict CSP like the real admin UI -->
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="icon" href="data:," />
</head>
<body>
  <h1>dev-admin (static Vite site on Amplify)</h1>

  <div class="card">
    <h2>Sign in</h2>
    <input id="email" placeholder="email" />
    <input id="password" type="password" placeholder="password" />
    <button id="login-btn">Sign in</button>
  </div>

  <div class="card">
    <h2>Infra checks</h2>
    <button data-path="/api/me">Cognito: /api/me</button>
    <button data-path="/api/admin/stats">DynamoDB + groups: stats</button>
    <button data-path="/api/admin/check/s3">S3</button>
    <button data-path="/api/admin/check/sqs">SQS</button>
    <button data-path="/api/admin/check/kms">KMS</button>
    <button data-path="/api/admin/check/secrets">Secrets Manager</button>
    <button data-path="/api/admin/check/egress">NAT egress</button>
    <pre id="result"></pre>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
